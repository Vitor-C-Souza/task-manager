# Adicionado MODE=MySQL e CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.url=jdbc:h2:mem:taskmanager_testdb;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração JPA para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY

# Flyway ativo para executar as migrations no H2
spring.flyway.enabled=true